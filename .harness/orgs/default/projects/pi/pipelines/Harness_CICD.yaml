pipeline:
  name: Harness_CI-CD
  identifier: Harness_CICD
  projectIdentifier: pi
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: dockerrag
        build: <+input>
  stages:
    - stage:
        name: "Build "
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: VM
            spec:
              type: Pool
              spec:
                poolName: ubuntu-gcp
                os: Linux
          execution:
            steps:
              - step:
                  type: OsvScanner
                  name: OsvScanner_1
                  identifier: OsvScanner_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - step:
                  type: Owasp
                  name: Owasp_1
                  identifier: Owasp_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: newdockerregistry_connector
                    repo: royjith/docker
                    tags:
                      - v1
              - step:
                  type: AquaTrivy
                  name: AquaTrivy_1
                  identifier: AquaTrivy_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      detection: auto
                    advanced:
                      log:
                        level: info
                    privileged: true
                    image:
                      type: docker_v2
                      tag: v1
                      name: royjith/docker
    - stage:
        name: Deployment
        identifier: Deployment
        description: ""
        type: Deployment
        spec:
          deploymentType: Ssh
          service:
            serviceRef: dockerservice
            serviceInputs:
              serviceDefinition:
                type: Ssh
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: prod_infra
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          echo "Searching for containers on port 8501..."
                           
                          # Find all containers (running or stopped) on port 8501
                          CONTAINERS=$(sudo docker ps -aq --filter "publish=8501")
                           
                          if [ -z "$CONTAINERS" ]; then
                              echo " No containers found on port 8501"
                              exit 0
                          fi
                           
                          # Process each container
                          for CONTAINER_ID in $CONTAINERS; do
                              # Get image name
                              IMAGE_NAME=$(sudo docker inspect --format='{{.Config.Image}}' $CONTAINER_ID 2>/dev/null)
                              CONTAINER_NAME=$(sudo docker inspect --format='{{.Name}}' $CONTAINER_ID 2>/dev/null | sed 's/\///')
                             
                              echo ""
                              echo "Container: $CONTAINER_NAME ($CONTAINER_ID)"
                              echo " Image: $IMAGE_NAME"
                             
                              # Remove container
                              echo " Removing container..."
                              sudo docker rm -f $CONTAINER_ID
                             
                              # Remove image
                              echo " Removing image..."
                              sudo docker rmi $IMAGE_NAME 2>/dev/null || echo " Image might be used by other containers"
                             
                              echo "Cleaned up!"
                          done
                           
                          echo ""
                          echo " All done!"
                           
                          # Show remaining images
                          echo ""
                          echo "Remaining rag-chatbot images:"
                          docker images | grep rag-chatbot || echo "None"
                           
                           
                          # Export secrets as environment variables
                          export COHERE_API_KEY="<+secrets.getValue("COHERE_API_KEY")>"
                          export PINECONE_API_KEY="<+secrets.getValue("PINECONE_API_KEY")>"
                          export VLLM_API_URL="<+secrets.getValue("VLLM_API_URL")>"
                           
                           
                          # Run container with secrets
                          /usr/bin/docker run -d \
                            --name rag-chatbot \
                            -p 8501:8501 \
                            -e COHERE_API_KEY \
                            -e PINECONE_API_KEY \
                            -e VLLM_API_URL \
                            --restart unless-stopped \
                            royjith/docker:v1
                            
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Ignore
